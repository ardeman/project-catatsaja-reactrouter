# Checks every change, and deploys main to Firebase Hosting once they pass.
#
# Built to keep working as GitHub updates its runners (ubuntu-latest moves to
# a new Ubuntu every two years): nothing is taken from the runner image.
# Node comes from .nvmrc, pnpm from package.json's packageManager, Java from
# setup-java, Chrome from Playwright's own installer, and the Firebase CLI at
# a pinned version. A weekly run catches a runner, Chrome or emulator change
# before it can block a deploy, and Dependabot keeps the actions current
# (.github/dependabot.yml).

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
  # Mondays 02:00 UTC: checks only, no deploy.
  schedule:
    - cron: '0 2 * * 1'
  # Run by hand from the Actions tab (deploys when run on main).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, unused code and unit tests
        run: pnpm validate
      # The Firestore and Auth emulators run on Java.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The emulators download their jars on first use; kept between runs,
      # keyed by the pinned Firebase CLI in package.json.
      - name: Cache the Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Test the Firestore rules
        run: pnpm test:rules

  # Whether anything besides documentation changed. A push or pull request
  # that changes only Markdown or docs skips the end-to-end tests; the
  # weekly and hand-started runs always test.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Look for changes other than docs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          # A new branch or a force push has no usable base: test.
          if { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } &&
            git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$HEAD" |
              grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The ui suite checks interface behaviour only: its failure shows, but
    # doesn't block a deploy. The others guard stored, shared and encrypted
    # data and must pass.
    continue-on-error: ${{ matrix.suite == 'ui' }}
    strategy:
      # Finish every suite even if another fails, so all failures are visible.
      fail-fast: false
      matrix:
        suite: [encryption, sharing, ai, ui]
    # Each suite needs its own runner: they use the same ports and some
    # reset the emulator database. Scenarios within a file stay sequential.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
      # The end-to-end tests drive Google Chrome; Playwright installs it and
      # the system libraries it needs on whatever Ubuntu the runner has
      # (--force: the runner image may already have a Chrome of its own).
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps --force chrome
      # A failed suite runs once more, on fresh emulators, before it fails:
      # browser timing on a busy runner shouldn't block a deploy.
      - name: End-to-end tests
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          for attempt in 1 2; do
            pnpm dlx firebase-tools@15.33.0 emulators:exec --only auth,firestore --project demo-catatsaja "node --test --test-concurrency=1 tests/e2e/$SUITE.test.mjs" && exit 0
            echo "::warning::$SUITE failed on attempt $attempt"
          done
          exit 1

  # Keep the existing "checks" status as the gate for branch protection
  # and deployment, including every matrix job (skipped for docs only).
  checks:
    needs: [validation, changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          if [ "$CODE_CHANGED" = false ]; then
            test "$E2E_RESULT" = skipped
          else
            test "$E2E_RESULT" = success
          fi

  deploy:
    needs: checks
    # Only main, from a push or a run by hand; never pull requests or the
    # weekly check.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time, in order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate web manifest
        run: node ./scripts/generate-manifest.mjs
      - name: Build
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_GRAVATAR_API_KEY: ${{ secrets.VITE_GRAVATAR_API_KEY }}
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
          VITE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_APP_CHECK_SITE_KEY }}
          # Local debug credentials must never enter a production build.
          VITE_APP_CHECK_DEBUG_TOKEN: ''
        run: pnpm exec react-router build
      - name: Verify build output
        run: test -f build/client/index.html && ls build/client
      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATAT_SAJA }}
          channelId: live
          projectId: catat-saja
